syntax = "proto3";
package demo.v1;

service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
  rpc Countdown (HelloRequest) returns (stream HelloReply);
  rpc Collect (stream HelloRequest) returns (HelloReply);
  rpc Chat (stream HelloRequest) returns (stream HelloReply);
  rpc Fail (HelloRequest) returns (HelloReply);
}

message HelloRequest {
  string name = 1;
  int32 times = 2;
  Tone tone = 3;
  repeated string tags = 4;
  Nested nested = 5;
}

message Nested { string note = 1; int64 big = 2; }

enum Tone { TONE_UNSPECIFIED = 0; TONE_FORMAL = 1; TONE_CASUAL = 2; }

message HelloReply {
  string message = 1;
  int64 counter = 2;
}
