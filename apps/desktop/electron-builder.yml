appId: com.crafillio.app
productName: API Devkit
copyright: Copyright © 2026 API Devkit

directories:
  output: release
  buildResources: build

# The main process is bundled by esbuild, so nothing from node_modules needs to
# ship. This is what keeps the packaged app close to the Electron baseline.
files:
  - dist/**/*
  - package.json

# Pinned explicitly: electron-builder downloads binaries for one exact release
# and cannot resolve the "^43.3.0" range from package.json on its own.
electronVersion: 43.3.0

npmRebuild: false

mac:
  artifactName: APIDevkit-mac-${arch}.${ext}
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  # Requires a Developer ID certificate; unsigned builds still run locally after
  # the user clears Gatekeeper.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  artifactName: APIDevkit-windows-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

# macOS and Windows only — the platforms this is distributed for.
